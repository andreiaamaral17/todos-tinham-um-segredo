
<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todos Tinham um Segredo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #130f14;
      color: #f3dfd4;
      font-family: Georgia, serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    main {
      width: 100%;
      max-width: 540px;
      text-align: center;
    }
    .eyebrow {
      color: #c78379;
      font: 12px Arial, sans-serif;
      letter-spacing: 4px;
    }
    h1 {
      font-size: clamp(42px, 9vw, 70px);
      line-height: 1.08;
      margin: 35px 0 15px;
    }
    .subtitle {
      color: #dca69b;
      font-style: italic;
      font-size: 20px;
    }
    .divider {
      height: 1px;
      background: #654047;
      margin: 35px 0;
    }
    .panel {
      background: #251b25;
      border: 1px solid #60414a;
      border-radius: 16px;
      padding: 28px 20px;
    }
    .panel p {
      font: 16px/1.7 Arial, sans-serif;
    }
    .small {
      color: #c9a9a5;
      font: 12px Arial, sans-serif;
      letter-spacing: 2px;
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">A HALLOWEEN MURDER MYSTERY</div>
    <h1>Todos Tinham<br>um Segredo.</h1>
    <p class="subtitle">Some secrets are worth killing for.</p>
    <div class="divider"></div>
    <div class="panel">
      <h2>THE DINNER PARTY</h2>
      <p>11 suspects. One victim. One killer.</p>
      <p>Uma noite entre amigos.<br>
      Segredos que nunca deveriam ser revelados.<br>
      E um crime que mudará tudo.</p>
      <p><strong>Trust no one.</strong></p>
    </div>
    <div class="small">CONFIDENTIAL · ACCESS COMING SOON</div>
  </main>
</body>
</html>
