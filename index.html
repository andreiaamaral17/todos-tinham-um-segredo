
<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Todos Tinham um Segredo</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:25px 18px;background:radial-gradient(ellipse at top,#39202c,#100d12 75%);color:#f3e0d8;font-family:Georgia,serif;display:grid;place-items:center}
main{max-width:520px;width:100%;text-align:center}
.eyebrow{font:11px Arial,sans-serif;letter-spacing:3px;color:#c99591}
h1{font-size:clamp(39px,9vw,65px);line-height:1.08;margin:28px 0 12px}
.subtitle{font-size:19px;font-style:italic;color:#dfaaa4}
.rule{height:1px;background:#66424b;margin:30px 0}
.card{border:1px solid #73515c;background:#251b25;border-radius:17px;padding:28px 21px}
h2{font-size:22px}
p{line-height:1.6}
label{display:block;text-align:left;margin:22px 0 9px;font:12px Arial,sans-serif;letter-spacing:1.5px;color:#e0b9b3}
input{width:100%;padding:15px;border-radius:8px;border:1px solid #77535f;background:#130f15;color:#fff;font-size:16px;text-align:center}
button{width:100%;margin-top:15px;padding:17px;background:#a4535d;color:#fff;border:0;border-radius:9px;font:bold 14px Arial,sans-serif;letter-spacing:1.5px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.note{font:12px/1.6 Arial,sans-serif;color:#c3a6ab}
#message{min-height:20px;font:14px/1.5 Arial,sans-serif;color:#efc0b9}
#character{text-align:left;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7}
footer{margin-top:28px;color:#aa8d95;font:11px Arial,sans-serif;letter-spacing:2px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<div class="eyebrow">A HALLOWEEN MURDER MYSTERY</div>
<h1>Todos Tinham<br>um Segredo.</h1>
<p class="subtitle">Some secrets are worth killing for.</p>
<div class="rule"></div>

<section class="card" id="login">
<h2>IDENTIDADE CONFIDENCIAL</h2>
<p>Onze convidados. Uma morte.<br>Segredos que ninguém deveria conhecer.</p>
<form id="accessForm">
<label for="accessCode">O TEU CÓDIGO PESSOAL</label>
<input id="accessCode" type="text"
placeholder="Introduz o código recebido"
autocomplete="off" autocapitalize="off"
spellcheck="false" required>
<button id="enter" type="submit">REVELAR IDENTIDADE</button>
</form>
<p id="message" role="status" aria-live="polite"></p>
<p class="note">O teu código será entregue em privado. Não o partilhes.</p>
</section>

<section class="card" id="profile" hidden>
<h2>A TUA IDENTIDADE</h2>
<div id="character"></div>
<button id="leave" type="button">FECHAR FICHA</button>
</section>

<footer>CONFIDENTIAL · TRUST NO ONE</footer>
</main>

<script>
'use strict';

const $ = id => document.getElementById(id);

function fromB64(s) {
  return Uint8Array.from(atob(s), c => c.charCodeAt(0));
}

async function unlock(code, record) {
  const enc = new TextEncoder();
  const material = await crypto.subtle.importKey(
    'raw', enc.encode(code), 'PBKDF2', false, ['deriveKey']
  );
  const key = await crypto.subtle.deriveKey(
    {
      name: 'PBKDF2',
      salt: fromB64(record.salt),
      iterations: 310000,
      hash: 'SHA-256'
    },
    material,
    {name: 'AES-GCM', length: 256},
    false,
    ['decrypt']
  );
  const clear = await crypto.subtle.decrypt(
    {name: 'AES-GCM', iv: fromB64(record.iv)},
    key,
    fromB64(record.ciphertext)
  );
  return new TextDecoder().decode(clear);
}

$('accessForm').addEventListener('submit', async event => {
  event.preventDefault();
  $('message').textContent = 'A verificar o código…';
  $('enter').disabled = true;
  const code = $('accessCode').value.trim();

  try {
    const response = await fetch('./personagens.json', {
      cache: 'no-store'
    });

    if (!response.ok) throw Error('not-ready');

    const records = await response.json();
    if (!Array.isArray(records)) throw Error('invalid');

    let found = null;
    for (const record of records) {
      try {
        found = await unlock(code, record);
        break;
      } catch (e) {
        // Este código não corresponde a esta ficha.
      }
    }

    if (found === null) {
      $('message').textContent =
        'Código não reconhecido. Confirma o código recebido.';
      return;
    }

    $('character').textContent = found;
    $('login').hidden = true;
    $('profile').hidden = false;

  } catch (error) {
    $('message').textContent =
      error.message === 'not-ready'
      ? 'As fichas ainda não foram publicadas.'
      : 'Não foi possível abrir as fichas. Tenta novamente.';
  } finally {
    $('accessCode').value = '';
    $('enter').disabled = false;
  }
});

$('leave').addEventListener('click', () => {
  $('character').textContent = '';
  $('profile').hidden = true;
  $('login').hidden = false;
  $('message').textContent = '';
});
</script>
</body>
</html>
